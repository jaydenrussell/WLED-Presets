name: Build presets

on:
  push:
    paths:
      - "Favorite_Presets.txt"
      - "build-presets.mjs"
      - ".github/workflows/build-presets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build wled_presets_Favorites.json
        run: node build-presets.mjs

      - name: Commit rebuilt presets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wled_presets_Favorites.json
          if git diff --staged --quiet; then
            echo "wled_presets_Favorites.json unchanged"
          else
            git commit -m "chore: rebuild wled_presets_Favorites.json"
            git push
          fi
